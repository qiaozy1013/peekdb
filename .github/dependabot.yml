version: 2
# Cap concurrent PRs. Default is 5; we keep it low because weekly
# cadence + grouped PRs makes 5+ trivial to hit, and unmerged PRs
# rot.
open-pull-requests-limit: 3

updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"
    # Group minor + patch updates into a single PR. Major versions
    # stay separate so they get individual review.
    groups:
      patch-dependencies:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions — every action upgrade used to land as its own
  # PR (PR #1 through #5 in the first week). Group them so we see
  # one PR per ecosystem run, not five.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-updates:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
